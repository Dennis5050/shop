version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: nexus_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: nexus_sockets
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nexus_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/nexus_sockets
      JWT_SECRET: nexus_prod_jwt_secret_key_849204812389
      JWT_REFRESH_SECRET: nexus_prod_jwt_refresh_secret_key_489201823901
      CLIENT_URL: http://localhost:5173
    ports:
      - '5000:5000'
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nexus_client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongodb_data:
